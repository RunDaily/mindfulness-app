  <h1>心锚是什么</h1>
  <p>心锚用来减少某些应用的无意识打开与超时使用。</p>
  <p>你在「方案」里选出要管的应用，并为它们设定规则。之后每次打开这些应用，心锚会在进入前先停下，让你确认这一次是否真的要进、要用多久。</p>
  <p>「今日」用来查看今天的使用情况，以及加入方案前后的变化。</p>
  <p>心锚不替代系统自带的屏幕使用时间；它侧重的是：<strong>打开前多一步确认，并按你设的规则拦住。</strong></p>
