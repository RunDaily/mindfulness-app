<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一周节奏 · 单 App</title>
  <style>
    :root {
      --ink: #070908; --paper: #e8ede6; --fog: #8b938c; --mist: #5c655e;
      --leaf: #3d7a4a; --leaf-text: #9fd4a8; --line: rgba(232,237,230,.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; color: var(--paper);
      background: radial-gradient(ellipse at 40% -8%, #1a2420 0%, transparent 48%), var(--ink);
      font-family: "SF Pro Text", "PingFang SC", sans-serif;
      padding: 28px 14px 64px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .hero { text-align: center; max-width: 420px; }
    .hero h1 {
      font-family: "Iowan Old Style", "Songti SC", Georgia, serif;
      font-size: 22px; font-weight: 500;
    }
    .hero p { margin-top: 8px; font-size: 13px; color: var(--fog); line-height: 1.6; }
    .phone {
      width: min(360px, 100%); aspect-ratio: 9/17.2; border-radius: 30px;
      border: 1px solid rgba(255,255,255,.1); background: #050706;
      display: flex; flex-direction: column; padding: 12px 12px 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,.4);
    }
    .bar { display: flex; justify-content: space-between; font-size: 10px; color: rgba(232,237,230,.4); padding: 2px 6px 8px; }
    .title { text-align: center; margin-bottom: 10px; }
    .title strong { display: block; font-size: 16px; font-weight: 500; }
    .title span { font-size: 11px; color: var(--fog); }
    .axis {
      display: grid; grid-template-columns: 28px 1fr; gap: 6px; margin-bottom: 4px; padding: 0 2px;
    }
    .axis ol {
      list-style: none; display: grid; grid-template-columns: repeat(4, 1fr);
      font-size: 10px; color: var(--fog); text-align: center;
    }
    .days { list-style: none; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .days li {
      flex: 1; display: grid; grid-template-columns: 28px 1fr; gap: 6px;
      align-items: stretch; padding: 3px 2px;
    }
    .meta { display: flex; flex-direction: column; justify-content: center; gap: 1px; }
    .meta b { font-size: 13px; font-weight: 500; }
    .meta em { font-style: normal; font-size: 10px; color: var(--fog); }
    .track {
      position: relative; border-radius: 3px; background: rgba(232,237,230,.045); overflow: hidden;
    }
    .track::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        to right,
        rgba(232,237,230,.1) 0, rgba(232,237,230,.1) 1px,
        transparent 1px, transparent 25%
      );
      pointer-events: none;
    }
    .blk {
      position: absolute; top: 14%; height: 72%; border-radius: 2px; background: var(--leaf);
    }
    .now {
      position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--paper);
      transform: translateX(-50%);
    }
    .today .meta b { color: var(--leaf-text); }
    .foot {
      margin-top: 8px; padding: 10px 12px; border-radius: 12px;
      background: rgba(232,237,230,.04); display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--fog);
    }
    .foot strong { color: var(--leaf-text); font-size: 14px; font-weight: 600; }
    .cap { max-width: 420px; font-size: 12px; color: var(--mist); text-align: center; line-height: 1.55; }
    .cap strong { color: var(--sand, #c4a35a); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>一周节奏 · 单 App</h1>
    <p>任意已装 App 可用。横轴几何按 24 小时，字只用凌晨 / 上午 / 下午 / 晚上。色块 = 该 App 前台时段。</p>
  </div>
  <div class="phone">
    <div class="bar"><span>9:41</span><span>心锚</span></div>
    <div class="title"><strong>抖音</strong><span>9月14日 – 20日</span></div>
    <div class="axis"><span></span><ol><li>凌晨</li><li>上午</li><li>下午</li><li>晚上</li></ol></div>
    <ol class="days">
      <li><div class="meta"><b>一</b><em>14</em></div><div class="track"><span class="blk" style="left:33.3%;width:2.5%"></span><span class="blk" style="left:87.5%;width:8.8%"></span></div></li>
      <li><div class="meta"><b>二</b><em>15</em></div><div class="track"><span class="blk" style="left:50%;width:2.1%"></span><span class="blk" style="left:79.2%;width:14.6%"></span></div></li>
      <li><div class="meta"><b>三</b><em>16</em></div><div class="track"><span class="blk" style="left:87.5%;width:5.4%"></span></div></li>
      <li><div class="meta"><b>四</b><em>17</em></div><div class="track"><span class="blk" style="left:8.3%;width:1.3%"></span><span class="blk" style="left:83.3%;width:9.2%"></span></div></li>
      <li><div class="meta"><b>五</b><em>18</em></div><div class="track"><span class="blk" style="left:75%;width:6.3%"></span><span class="blk" style="left:85.4%;width:12.5%"></span></div></li>
      <li><div class="meta"><b>六</b><em>19</em></div><div class="track"><span class="blk" style="left:1.3%;width:4.2%"></span><span class="blk" style="left:70.8%;width:16.7%"></span></div></li>
      <li class="today"><div class="meta"><b>日</b><em>20</em></div><div class="track"><span class="blk" style="left:37.5%;width:4.2%"></span><span class="blk" style="left:58.3%;width:7.5%"></span><span class="now" style="left:90.3%"></span></div></li>
    </ol>
    <div class="foot"><span>今天 · 打开 2 次</span><strong>2.1 时</strong></div>
  </div>
  <p class="cap">入口：探索 · App 详情 ·「一周节奏」；监控详情 / 今日详情同进同一页。不混多个 App。</p>
</body>
</html>
